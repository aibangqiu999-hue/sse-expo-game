<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b2340">
<title>숨은 사회연대경제 찾기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
:root{
  --ink:#2b2340; --paper:#fff8e7; --paper2:#f1e3c2; --coral:#ff6a4d; --coral-d:#c8452e; --coral-l:#ff9d85;
  --sun:#ffc63a; --sun-d:#d98a12; --mint:#2fae90; --mint-d:#1f7d66; --red:#ff2a4a; --muted:#6b5f86;
  --font:'Galmuri11','Galmuri9','Apple SD Gothic Neo','Malgun Gothic',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;
  -webkit-font-smoothing:none}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}

/* fixed pixel background for menu screens */
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.screen{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow:auto}

/* pixel primitives */
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;cursor:pointer;
  background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:0;font-size:20px;touch-action:manipulation;
  box-shadow:inset -4px -4px 0 #cfc6b0,inset 4px 4px 0 #fff,4px 4px 0 var(--ink)}
.pbtn:active{transform:translate(4px,4px);box-shadow:inset -4px -4px 0 #cfc6b0,inset 4px 4px 0 #fff}
.pbtn.coral{background:var(--coral);color:#fff;box-shadow:inset -4px -4px 0 var(--coral-d),inset 4px 4px 0 var(--coral-l),4px 4px 0 var(--ink)}
.pbtn.coral:active{box-shadow:inset -4px -4px 0 var(--coral-d),inset 4px 4px 0 var(--coral-l)}
.pbtn.small{min-height:44px;font-size:16px;padding:0 14px}
.pbtn:focus-visible,input:focus-visible{outline:4px dashed var(--sun);outline-offset:3px}
.panel{background:var(--paper);border:4px solid var(--ink);box-shadow:inset -4px -4px 0 var(--paper2),inset 4px 4px 0 #fff,6px 6px 0 var(--ink);padding:18px 20px}
.outl{color:#fff;text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),3px 3px var(--ink),-3px 3px var(--ink),3px -3px var(--ink),-3px -3px var(--ink),6px 6px 0 var(--ink)}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tag{display:inline-block;background:var(--ink);color:#fff;padding:3px 10px;font-size:14px}

/* title */
.title-wrap{display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,56px);width:min(1200px,100%);flex-wrap:wrap}
.title-main{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;flex:1 1 420px}
.t-event{font-size:clamp(15px,2.2vw,22px)}
.t-game{font-family:'Galmuri14','Galmuri11',monospace;font-size:clamp(38px,7vw,78px);line-height:1.15;margin:4px 0}
.t-game .hl{color:var(--sun)}
.t-desc{font-size:clamp(14px,1.9vw,20px);background:rgba(43,35,64,.82);color:#fff;padding:4px 12px}
.t-start{font-size:28px;min-height:68px;padding:0 40px;margin-top:10px}
.rank{flex:0 1 300px;width:100%;max-width:340px}
.rank h3{margin:0 0 10px;font-size:18px;color:var(--coral);font-weight:400}
.rank ol{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:16px}
.rank li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:2px 4px}
.rank li:nth-child(1){background:#ffe9a8}.rank li:nth-child(2){background:#eef0f6}.rank li:nth-child(3){background:#f6dcc7}
.rank .no{font-family:'GalmuriMono11',monospace}
.rank .empty{color:var(--muted);font-size:14px}
.rank small{display:block;margin-top:8px;color:var(--muted);font-size:12px}
.fs-btn{position:fixed;right:12px;bottom:12px;z-index:3;opacity:.75}

/* entry */
.entry{width:min(760px,100%);display:flex;flex-direction:column;gap:16px}
.entry h2,.pick h2{margin:0;font-size:clamp(22px,3.4vw,30px);font-weight:400}
.name-in{width:100%;min-height:64px;border:4px solid var(--ink);border-radius:0;background:#fff;padding:0 16px;font-size:28px;
  box-shadow:inset 4px 4px 0 #e6dcc4;-webkit-user-select:text;user-select:text}
.err{color:var(--red);min-height:1.4em;margin:-6px 0 0;font-size:15px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.rule{background:#fff;border:3px solid var(--ink);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.rule canvas{width:36px;height:36px;flex:none}
.rule b{display:block;font-weight:400;font-size:18px;color:var(--coral)}
.row{display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}

/* pick */
.pick{width:min(1100px,100%);display:flex;flex-direction:column;gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0}
.card:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.card canvas{width:100%;aspect-ratio:1.6;display:block;border-bottom:4px solid var(--ink)}
.card .cb{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:22px;font-weight:400}
.card p{margin:0;font-size:14px;color:var(--muted)}
.card .go{align-self:flex-end;background:var(--coral);color:#fff;border:3px solid var(--ink);padding:2px 12px;font-size:16px}

/* game */
#game{background:#3a3160;align-items:stretch;justify-content:flex-start;flex-direction:column;gap:10px;
  background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px);background-size:16px 16px}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#fff}
.hud .who{flex:1;min-width:140px;font-size:20px}
.hud .who small{display:block;font-size:13px;color:#cfc7ea}
.stat{background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:4px 4px 0 #1a1530;min-width:88px;text-align:center;padding:2px 10px;line-height:1.2}
.stat b{display:block;font-family:'GalmuriMono11',monospace;font-weight:400;font-size:24px}
.stat small{font-size:12px;color:var(--muted)}
.stat.warn b{color:var(--red)}.stat.warn{animation:blink .5s steps(1) infinite}
.play{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:10px}
.tray{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tray li{flex:none;display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);padding:3px 10px 3px 3px;font-size:15px;white-space:nowrap}
.tray li canvas{width:30px;height:30px;background:#fff;border:2px solid var(--ink)}
.tray li small{font-size:11px;background:var(--sun);border:2px solid var(--ink);padding:0 4px;margin-left:2px}
.tray li.found{background:#c9f0dd;color:var(--mint-d);text-decoration:line-through;text-decoration-thickness:3px}
.stage-wrap{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;aspect-ratio:1.6;width:min(100%,calc((100dvh - 190px) * 1.6));border:4px solid var(--ink);box-shadow:6px 6px 0 #1a1530;background:#000;touch-action:none;cursor:crosshair}
.stage canvas{width:100%;height:100%;display:block}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:8px}
.zoom .pbtn{width:52px;min-height:52px;padding:0;font-size:24px}
.ready{position:absolute;inset:0;display:grid;place-items:center;background:rgba(43,35,64,.45);font-family:'Galmuri14',monospace;font-size:clamp(40px,9vw,96px);pointer-events:none}
@media (min-width:1000px){
  .play{grid-template-columns:220px 1fr;grid-template-rows:1fr}
  .tray{flex-direction:column;flex-wrap:nowrap}
  .stage{width:min(100%,calc((100dvh - 120px) * 1.6))}
}

/* modal */
.modal{position:fixed;inset:0;z-index:10;background:rgba(20,16,40,.6);display:grid;place-items:center;padding:16px}
.modal .panel{width:min(560px,100%);display:flex;flex-direction:column;gap:14px;text-align:center;max-height:100%;overflow:auto}
.modal h2{margin:0;font-family:'Galmuri14',monospace;font-weight:400;font-size:clamp(28px,5vw,40px);color:var(--coral)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res .stat{min-width:0;box-shadow:none}
.stars{display:flex;justify-content:center;gap:10px}
.stars canvas{width:48px;height:48px}
.save{font-size:15px}
.save.ok{color:var(--mint-d)}.save.wait{color:var(--muted)}.save.err{color:var(--red)}
.modal .row{justify-content:center}
</style>
</head>
<body>
<canvas id="bg" width="240" height="150" aria-hidden="true"></canvas>

<!-- 1. TITLE -->
<section class="screen" id="s-title">
  <div class="title-wrap">
    <div class="title-main">
      <span class="tag" id="t-host"></span>
      <span class="t-event outl" id="t-event"></span>
      <h1 class="t-game outl" id="t-game"></h1>
      <span class="t-desc" id="t-desc"></span>
      <button class="pbtn coral t-start" id="btn-start"><span class="blink">▶</span> 시작</button>
    </div>
    <aside class="panel rank" id="rank-box" aria-live="polite">
      <h3>★ 오늘의 TOP 10</h3>
      <ol id="rank-list"></ol>
      <small id="rank-note"></small>
    </aside>
  </div>
  <button class="pbtn small fs-btn" id="btn-fs" aria-label="전체화면">⛶</button>
</section>

<!-- 2. NAME + RULES -->
<section class="screen" id="s-entry" hidden>
  <form class="panel entry" id="entry-form" autocomplete="off">
    <h2>▶ 이름을 입력하세요</h2>
    <input class="name-in" id="name-in" maxlength="12" placeholder="홍길동" enterkeyhint="next" aria-label="이름">
    <p class="err" id="name-err" role="alert"></p>
    <div class="rules">
      <div class="rule"><canvas width="12" height="12" data-spr="magnifier"></canvas><div><b>찾기</b>그림 속에 숨은 사회연대경제 제품 10개를 찾아 누르세요.</div></div>
      <div class="rule"><canvas width="12" height="12" data-spr="clock"></canvas><div><b>30초</b>맞으면 +100점, 틀리면 −20점. 다 찾으면 남은 1초당 +10점!</div></div>
      <div class="rule"><canvas width="12" height="12" data-spr="hand"></canvas><div><b>확대</b>두 손가락으로 벌리거나 + 버튼. 확대한 뒤 끌어서 이동해요.</div></div>
    </div>
    <div class="row">
      <button type="button" class="pbtn small" id="btn-entry-back">◀ 처음으로</button>
      <button type="submit" class="pbtn coral">다음 ▶</button>
    </div>
  </form>
</section>

<!-- 3. PICK SCENE -->
<section class="screen" id="s-pick" hidden>
  <div class="pick">
    <div class="panel" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px">
      <h2 id="pick-title"></h2>
      <button class="pbtn small" id="btn-pick-back">◀ 이름 다시 쓰기</button>
    </div>
    <div class="cards" id="cards"></div>
  </div>
</section>

<!-- 4. GAME -->
<section class="screen" id="game" hidden>
  <div class="hud">
    <button class="pbtn small" id="btn-quit">◀ 나가기</button>
    <div class="who"><span id="g-name"></span><small id="g-scene"></small></div>
    <div class="stat" id="g-timebox"><b id="g-time">0:30</b><small>남은 시간</small></div>
    <div class="stat"><b id="g-count">0/10</b><small>찾음</small></div>
    <div class="stat"><b id="g-score">0</b><small>점수</small></div>
    <button class="pbtn small" id="btn-sound" aria-pressed="true">소리 켬</button>
  </div>
  <div class="play">
    <ul class="tray" id="tray" aria-label="찾을 제품"></ul>
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="view"></canvas>
        <div class="ready outl" id="ready" hidden></div>
        <div class="zoom">
          <button class="pbtn" id="z-in" aria-label="확대">+</button>
          <button class="pbtn" id="z-out" aria-label="축소">−</button>
          <button class="pbtn" id="z-reset" aria-label="원래 크기" style="font-size:18px">⟲</button>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="modal" id="modal" hidden><div class="panel" id="sheet" role="dialog" aria-modal="true"></div></div>

function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function T(ctx,pal=P){
  const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
  const D=(x,y,c)=>R(x,y,1,1,c);
  const circ=(cx,cy,r,c)=>{for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++)if(i*i+j*j<=r*r+r*.8)D(cx+i,cy+j,c)};
  const box=(x,y,w,h,f,hi,sh)=>{R(x,y,w,h,K);R(x+1,y+1,w-2,h-2,f);if(hi)R(x+1,y+1,w-2,1,hi);if(sh)R(x+1,y+h-2,w-2,1,sh)};
  const spr=(a,x,y,map)=>a.forEach((row,j)=>{for(let i=0;i<row.length;i++){const ch=row[i];if(ch==='.')continue;const c=(map&&map[ch])||pal[ch];if(c)D(x+i,y+j,c)}});
  const line=(x0,y0,x1,y1,c)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++)D(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),c)};
  return{R,D,circ,box,spr,line,ctx};
}
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return seed/2147483647}}

function sky(t,gy,bands){bands.forEach((c,i)=>{const y0=Math.round(gy*i/bands.length),y1=Math.round(gy*(i+1)/bands.length);t.R(0,y0,W,y1-y0,c)})}
function cloud(t,x,y,s=1){const parts=[[0,0,5],[6,-2,6],[13,0,5],[-6,2,3],[18,2,3]];
  parts.forEach(([dx,dy,r])=>t.circ(x+Math.round(dx*s),y+Math.round(dy*s)+1,Math.round(r*s),'#d6ecfb'));
  parts.forEach(([dx,dy,r])=>t.circ(x+Math.round(dx*s),y+Math.round(dy*s),Math.round(r*s),'#fff'))}
function hills(t,gy,c1,c2){for(let i=0;i<W;i++){const h=Math.round(11+6*Math.sin(i/15)+3*Math.sin(i/5.3));t.R(i,gy-h,1,h,c1)}
  for(let i=0;i<W;i++){const h=Math.round(5+4*Math.sin(i/9+2));t.R(i,gy-h,1,h,c2)}}
function tree(t,x,by,s=1){const tr=Math.round(14*s);t.R(x-2,by-tr,5,tr,K);t.R(x-1,by-tr,3,tr-1,'#8a5a3b');t.R(x-1,by-tr,1,tr-1,'#a87448');
  const cy=by-tr-Math.round(4*s),L=[[0,-5,9],[-7,0,6],[7,0,6]].map(([a,b,r])=>[x+Math.round(a*s),cy+Math.round(b*s),Math.round(r*s)]);
  L.forEach(([a,b,r])=>t.circ(a,b,r+1,K));L.forEach(([a,b,r])=>t.circ(a,b,r,'#3f9a2a'));
  L.forEach(([a,b,r])=>t.circ(a-1,b-2,Math.max(1,r-3),'#5cc23c'));t.circ(x-3,cy-9,Math.max(1,Math.round(2*s)),'#8fe06a')}

function bunting(t,x0,x1,y,sag){const n=Math.floor((x1-x0)/9);for(let i=0;i<=x1-x0;i++){const u=i/(x1-x0);t.D(x0+i,Math.round(y+sag*4*u*(1-u)),K)}

// ③ 바닥 그림자: 스프라이트 맨 아랫줄 실제 폭만큼 아래 2줄
function shadow(t,k,x,y){const rows=SPR[k],last=rows[rows.length-1];let l=last.search(/[^.]/),r=last.length-1-[...last].reverse().join('').search(/[^.]/);
  if(l<0){l=0;r=last.length-1}t.R(x+l-1,y+rows.length-1,r-l+3,2,SHADOW)}

const QM=['.kkk.','k...k','...k.','..k..','.....','..k..'];
function crateClosed(t,x,y){const w=14,h=13,X=x-1,Y=y-1;
  t.R(X+1,Y+h,w,2,SHADOW);
  t.box(X,Y,w,h,'#e2a65b','#f6d39b','#b97a35');t.R(X,Y+4,w,1,K);           // 뚜껑 경계
  t.R(X+1,Y+1,w-2,3,'#c08552');t.R(X+1,Y+1,w-2,1,'#e2a65b');
  for(let i=X+3;i<X+w-2;i+=4)t.R(i,Y+5,1,h-6,'#b97a35');                 // 판자 이음
  t.box(X+4,Y+5,6,7,'#fff3b0');t.spr(QM.map(r=>r.replace(/k/g,'o')),X+5,Y+6) // 물음표 표
}
function crateBack(t,x,y,k){const w=14,X=x-1,ih=SPR[k].length;             // 열린 상자: 젖힌 뚜껑 + 안쪽
  t.R(X+1,y+ih+1,w,2,SHADOW);t.box(X,y-5,w,4,'#c08552','#e2a65b');t.R(X,y-1,w,ih-3,'#7a4a2c');t.R(X,y-1,1,ih-3,K);t.R(X+w-1,y-1,1,ih-3,K)}
function crateFront(t,x,y,k){const w=14,X=x-1,ih=SPR[k].length,Y=y+ih-5;     // 아래 5줄만 가리는 앞판

let actx=null,soundOn=store.get('expo_sound',true);
function tone(seq){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;seq.forEach(([f,d,st,type])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+st);g.gain.exponentialRampToValueAtTime(.12,t0+st+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+st+d);o.connect(g).connect(actx.destination);o.start(t0+st);o.stop(t0+st+d+.05)})}catch(e){}}

const device=(()=>{const q=new URLSearchParams(location.search).get('device');if(q){store.set('expo_device',q);return q}let d=store.get('expo_device',null);if(!d){d='T-'+Math.random().toString(36).slice(2,6).toUpperCase();store.set('expo_device',d)}return d})();
let pending=store.get('expo_pending',[]);
function saveLocalScore(rec){const all=store.get('expo_local_scores',{});(all[rec.date]=all[rec.date]||[]).push({name:rec.name,score:rec.score,scene:rec.scene});store.set('expo_local_scores',all)}
function localTop(date){const list=(store.get('expo_local_scores',{})[date]||[]);const best={};list.forEach(e=>{if(!best[e.name]||e.score>best[e.name].score)best[e.name]=e});return Object.values(best).sort((a,b)=>b.score-a.score)}
function queueRecord(rec){pending.push(rec);store.set('expo_pending',pending);saveLocalScore(rec);return flush()}
let flushing=null;
async function flush(){if(!CONFIG.SHEET_URL||!pending.length)return !pending.length;if(flushing)return flushing;
  flushing=(async()=>{for(const rec of [...pending]){try{
      await withTimeout(fetch(CONFIG.SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)}),10000);
      pending=pending.filter(p=>p.id!==rec.id);store.set('expo_pending',pending)}catch(e){break}}
    flushing=null;return !pending.length})();return flushing}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
setInterval(flush,30000);window.addEventListener('online',flush);
async function fetchRank(score){const date=today();
  if(CONFIG.SHEET_URL){try{const u=CONFIG.SHEET_URL+(CONFIG.SHEET_URL.includes('?')?'&':'?')+'action=top&date='+date+(score!=null?'&score='+score:'');
      const res=await withTimeout(fetch(u),8000);const j=await res.json();if(j&&Array.isArray(j.top))return{src:'sheet',top:j.top,rank:j.rank}}catch(e){}}
  const top=localTop(date);return{src:'local',top,rank:score!=null?1+top.filter(e=>e.score>score).length:null}}

/* render: nearest-neighbour blit of the dot scene + dot-space marks */
let marks=mkCanvas(W,H),mt=T(marks.getContext('2d'));
function ring(cx,cy,r,c,dash){const pts=new Set();for(let a=0;a<360;a+=2){const x=Math.round(cx+r*Math.cos(a*Math.PI/180)),y=Math.round(cy+r*Math.sin(a*Math.PI/180));pts.add(x+','+y)}
  let i=0;pts.forEach(p=>{const [x,y]=p.split(',').map(Number);if(!dash||(i++%4)<2)mt.D(x,y,c)})}
function drawMarks(){mt.ctx.clearRect(0,0,W,H);const now=performance.now();
  G.items.forEach((it,i)=>{if(it.k!==HIDE[G.key].crate)return;
    if(!G.opened.has(i)&&!G.reveal)crateClosed(mt,it.x,it.y);else{crateBack(mt,it.x,it.y,it.k);mt.spr(SPR[it.k],it.x,it.y);crateFront(mt,it.x,it.y,it.k)}});
  G.items.forEach((it,i)=>{const cx=it.x+it.w/2-.5,cy=it.y+it.h/2-.5,r=Math.max(it.w,it.h)/2+2;
    if(G.found.has(i)){ring(cx,cy,r+1,'#fff');ring(cx,cy,r,'#ff2a4a');ring(cx,cy,r-.6,'#ff2a4a')}
    else if(G.reveal){ring(cx,cy,r,'#ffd23f',true);ring(cx,cy,r+1,K,true)}});
  G.misses=G.misses.filter(m=>now-m.t<800);G.misses.forEach(m=>{for(let d=-2;d<=2;d++){mt.D(m.x+d,m.y+d,'#ff2a4a');mt.D(m.x+d,m.y-d,'#ff2a4a')}})}
function render(){const v=G.vb;vctx.imageSmoothingEnabled=false;vctx.clearRect(0,0,view.width,view.height);
  if(!base)return;vctx.drawImage(base,v.x,v.y,v.w,v.h,0,0,view.width,view.height);drawMarks();vctx.drawImage(marks,v.x,v.y,v.w,v.h,0,0,view.width,view.height)}
function resize(){const r=stage.getBoundingClientRect(),dpr=window.devicePixelRatio||1;view.width=Math.max(1,Math.round(r.width*dpr));view.height=Math.max(1,Math.round(r.height*dpr));render()}
window.addEventListener('resize',()=>{if(cur==='game')resize()});
function setVB(v){const w=clamp(v.w,W/5,W),h=w*H/W;G.vb={x:clamp(v.x,0,W-w),y:clamp(v.y,0,H-h),w,h};render()}
function toDot(cx,cy,vb=G.vb){const r=view.getBoundingClientRect();return{x:vb.x+(cx-r.left)/r.width*vb.w,y:vb.y+(cy-r.top)/r.height*vb.h}}
function zoomAt(newW,anchor,baseVB,curPt){const r=view.getBoundingClientRect();const a=toDot(anchor.x,anchor.y,baseVB);const w=clamp(newW,W/5,W),h=w*H/W;setVB({x:a.x-(curPt.x-r.left)/r.width*w,y:a.y-(curPt.y-r.top)/r.height*h,w,h})}
function zoomBtn(f){const r=view.getBoundingClientRect();const c={x:r.left+r.width/2,y:r.top+r.height/2};zoomAt(G.vb.w*f,c,{...G.vb},c)}
$('#z-in').onclick=()=>zoomBtn(1/1.5);$('#z-out').onclick=()=>zoomBtn(1.5);$('#z-reset').onclick=()=>setVB({x:0,y:0,w:W,h:H});
(function(){const pts=new Map();let moved=false,pinch=null,pan=null;const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  view.addEventListener('pointerdown',e=>{try{view.setPointerCapture(e.pointerId)}catch(_){}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){moved=false;pan={x:e.clientX,y:e.clientY,vb:{...G.vb}}}
    else if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:dist(a,b)||1,vb:{...G.vb},m:mid(a,b)};moved=true;pan=null}});
  view.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch){const [a,b]=[...pts.values()];zoomAt(pinch.vb.w*pinch.d/(dist(a,b)||1),pinch.m,pinch.vb,mid(a,b))}
    else if(pts.size===1&&pan){const dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.hypot(dx,dy)>10)moved=true;if(moved){const k=pan.vb.w/view.getBoundingClientRect().width;setVB({...pan.vb,x:pan.vb.x-dx*k,y:pan.vb.y-dy*k})}}});
  const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pts.size===0){if(!moved&&e.type==='pointerup')guess(e.clientX,e.clientY);pinch=null;pan=null}
    else if(pts.size===1){pinch=null;const [p]=[...pts.values()];pan={x:p.x,y:p.y,vb:{...G.vb}}}};
  view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
  view.addEventListener('wheel',e=>{e.preventDefault();const c={x:e.clientX,y:e.clientY};zoomAt(G.vb.w*(e.deltaY>0?1.15:1/1.15),c,{...G.vb},c)},{passive:false});
})();
function guess(cx,cy){if(G.done||!G.running)return;const p=toDot(cx,cy);const tol=12*G.vb.w/view.getBoundingClientRect().width;
  let hit=-1,bd=1e9;G.items.forEach((it,i)=>{const d=Math.hypot(it.x+it.w/2-p.x,it.y+it.h/2-p.y);if(d<Math.max(it.w,it.h)/2+1+tol&&d<bd){bd=d;hit=i}});
  if(hit>=0&&G.items[hit].k===HIDE[G.key].crate&&!G.opened.has(hit)){G.opened.add(hit);sOpen();render();return} // 상자: 먼저 열기(감점 없음)
  if(hit>=0){if(G.found.has(hit))return;G.found.add(hit);const li=$(`#tray li[data-k="${hit}"]`);if(li){li.classList.add('found');li.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}
    sOk();updateStats();render();if(G.found.size===G.items.length)end(true)}
  else{G.wrong++;G.misses.push({x:Math.round(p.x),y:Math.round(p.y),t:performance.now()});sBad();updateStats();render();setTimeout(render,820)}}

function end(cleared){if(G.done)return;G.done=true;G.running=false;clearInterval(G.timer);G.sec=Math.min(CONFIG.TIME_LIMIT,(performance.now()-G.t0)/1000);
  const rem=Math.max(0,CONFIG.TIME_LIMIT-G.sec),bonus=cleared?Math.ceil(rem)*10:0,total=score()+bonus;$('#g-timebox').classList.remove('warn');$('#g-score').textContent=total;
  if(!cleared){$('#g-time').textContent='0:00';G.reveal=true;render();sBad()}else{$('#g-time').textContent=fmt(Math.ceil(rem))}
  const stars=cleared?((rem>=12&&G.wrong<=2)?3:rem>=5?2:1):0;
  const rec={id:uid(),date:today(),time:new Date().toISOString(),name:player,scene:SCENES[G.key].title,result:cleared?'완료':'시간끝',
    found:G.found.size,total:G.items.length,wrong:G.wrong,sec:Math.round(G.sec*10)/10,score:total,device};
  const best=store.get('expo_best',{});const isBest=!best[G.key]||total>best[G.key];if(isBest){best[G.key]=total;store.set('expo_best',best)}
  setTimeout(()=>{if(cleared)sWin();
    openModal(`<h2>${cleared?'STAGE CLEAR!':'TIME UP!'}</h2>
      <p style="margin:0;font-size:20px">${esc(player)}님, ${cleared?'모두 찾았어요!':`${G.items.length}개 중 <b style="color:var(--coral);font-weight:400">${G.found.size}개</b>를 찾았어요`}</p>
      ${cleared?`<div class="stars">${[0,1,2].map(i=>`<canvas data-star="${i<stars?'star':'starOff'}"></canvas>`).join('')}</div>`:''}
      <div class="res"><div class="stat"><b>${cleared?fmt(G.sec):G.found.size+'/'+G.items.length}</b><small>${cleared?'걸린 시간':'찾은 개수'}</small></div><div class="stat"><b>${G.wrong}</b><small>틀린 횟수</small></div><div class="stat"><b>${total}</b><small>점수${bonus?` (+${bonus})`:''}</small></div></div>
      <p class="save wait" id="save-msg">기록 저장 중…</p>
      ${cleared?'':'<p style="margin:0;font-size:14px;color:var(--muted)">노란 점선이 못 찾은 제품이에요.</p>'}
      <div class="row">${cleared?'':'<button class="pbtn small" data-m="look">정답 보기</button>'}<button class="pbtn small" data-m="again">다시 하기</button><button class="pbtn small coral" data-m="home">처음으로</button></div>`,
      act=>{if(act==='look')closeModal();else if(act==='again'){closeModal();openPick()}else if(act==='home')goTitle()});
    document.querySelectorAll('[data-star]').forEach(c=>sprCanvas(c,c.dataset.star));
    queueRecord(rec).then(async ok=>{const m=$('#save-msg');if(!m)return;
      const {rank,src}=await fetchRank(total);const rk=rank?` · 오늘 ${rank}위`:'';
      if(!CONFIG.SHEET_URL){m.className='save ok';m.textContent='이 기기에 기록했어요'+rk}
      else if(ok){m.className='save ok';m.textContent='기록 저장 완료'+rk}
      else{m.className='save err';m.textContent='인터넷 연결이 끊겨 잠시 보관 중 (자동 재전송)'+rk}});
  },cleared?500:900)}
$('#btn-quit').onclick=()=>{stopGame();openPick()};
const sb=$('#btn-sound');const syncSound=()=>{sb.textContent=soundOn?'소리 켬':'소리 끔';sb.setAttribute('aria-pressed',soundOn)};syncSound();
sb.onclick=()=>{soundOn=!soundOn;store.set('expo_sound',soundOn);syncSound()};

/* ---------------- modal ---------------- */
let modalCb=null;
function openModal(html,cb){$('#sheet').innerHTML=html;modalCb=cb;$('#modal').hidden=false}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML='';modalCb=null}
$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b&&modalCb)modalCb(b.dataset.m)});

/* ---------------- kiosk: idle reset, no context menu ---------------- */
let lastAct=Date.now();['pointerdown','keydown','wheel'].forEach(ev=>window.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true,capture:true}));
setInterval(()=>{if(cur!=='s-title'&&!G.running&&Date.now()-lastAct>CONFIG.IDLE_SEC*1000)goTitle()},3000);
window.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

goTitle();flush();
</script>
</body>
</html>
